<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clear Trade Engine — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main">
        <header class="main-header">
            <h1>Clear Trade Engine</h1>
            <p>A global trade toolkit for finding shipping deals, predicting currency trends, and calculating landed costs.</p>
        </header>

        <div class="empty-state">
            <p>Use the sidebar to get started &mdash; Find Deals, Currency Prediction, or the Route Calculator.</p>
        </div>
    </main>
    <div class="sidebar-ai">
        <div class="sidebar-ai-label">
            <span class="status-dot"></span>
            Trade AI Assistant
        </div>
        <form class="sidebar-ai-form" th:action="@{/ai-assistant}" method="post">
            <input type="hidden" name="returnPage" th:value="${currentPage}">
            <input type="text" name="query" placeholder="Ask about shipping delays..." required>
            <button type="submit">Ask</button>
        </form>
        <div class="sidebar-ai-answer" th:if="${aiAnswer}">
            <p class="sidebar-ai-answer-q" th:text="'&quot;' + ${aiQuestion} + '&quot;'"></p>
            <p th:text="${aiAnswer}"></p>
        </div>
    </div>

    <div class="sidebar-footer">
        <div class="status-dot"></div>
        <span>System online</span>
    </div>
</div>

</body>
</html>
