<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clear Trade Engine — Find Deals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main">

        <header class="main-header">
            <h1>Find Deals</h1>
            <p>Pick a product category and destination port to see the lowest landed cost, ranked automatically.</p>
        </header>

        <form class="search-form" th:action="@{/find-deals}" method="post">
            <div class="field">
                <label for="destinationPort">Destination port</label>
                <select id = "destinationPort" name = "destinationPort"required>
                    <option value="">Select a destination port&hellip;</option>
                    <option th:each = "port : ${destinationPorts}"th:value = "${port}" th:text ="${port}"></option>
                </select>
            </div>

            <div class="field">
                <label for="category">Product category</label>
                <select id="category" name="category" required>
                    <option value="">Select a category&hellip;</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                </select>
            </div>

            <button type="submit" class="primary-btn">Search routes</button>
        </form>

        <p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <div class="results" th:if="${calculationSuccess}">

            <div class="result-card result-card--top" th:if="${topDeal}">
                <span class="result-rank">Best deal</span>
                <h3 th:text="${topDeal.originPort} + ' &rarr; ' + ${topDeal.destinationPort}"></h3>
                <div class="result-stats">
                    <div><span class="stat-label">Category</span><span class="stat-value" th:text="${product}"></span></div>
                    <div><span class="stat-label">Total cost</span><span class="stat-value" th:text="'$' + ${#numbers.formatDecimal(topDeal.calculatedFinalCost, 1, 2)}"></span></div>
                    <div><span class="stat-label">Transit days</span><span class="stat-value" th:text="${topDeal.transitDays}"></span></div>
                    <div><span class="stat-label">Incoterm</span><span class="stat-value" th:text="${topDeal.incoterm}"></span></div>
                </div>
            </div>

            <div class="result-card" th:if="${secondDeal}">
                <span class="result-rank">2nd</span>
                <h3 th:text="${secondDeal.originPort} + ' &rarr; ' + ${secondDeal.destinationPort}"></h3>
                <div class="result-stats">
                    <div><span class="stat-label">Total cost</span><span class="stat-value" th:text="'$' + ${#numbers.formatDecimal(secondDeal.calculatedFinalCost, 1, 2)}"></span></div>
                    <div><span class="stat-label">Transit days</span><span class="stat-value" th:text="${secondDeal.transitDays}"></span></div>
                </div>
            </div>

            <div class="result-card" th:if="${thirdDeal}">
                <span class="result-rank">3rd</span>
                <h3 th:text="${thirdDeal.originPort} + ' &rarr; ' + ${thirdDeal.destinationPort}"></h3>
                <div class="result-stats">
                    <div><span class="stat-label">Total cost</span><span class="stat-value" th:text="'$' + ${#numbers.formatDecimal(thirdDeal.calculatedFinalCost, 1, 2)}"></span></div>
                    <div><span class="stat-label">Transit days</span><span class="stat-value" th:text="${thirdDeal.transitDays}"></span></div>
                </div>
            </div>

            <div class="result-card" th:if="${fourthDeal}">
                <span class="result-rank">4th</span>
                <h3 th:text="${fourthDeal.originPort} + ' &rarr; ' + ${fourthDeal.destinationPort}"></h3>
                <div class="result-stats">
                    <div><span class="stat-label">Total cost</span><span class="stat-value" th:text="'$' + ${#numbers.formatDecimal(fourthDeal.calculatedFinalCost, 1, 2)}"></span></div>
                    <div><span class="stat-label">Transit days</span><span class="stat-value" th:text="${fourthDeal.transitDays}"></span></div>
                </div>
            </div>

        </div>

    </main>

</div>

</body>
</html>
